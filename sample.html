<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>KiNote - 現在の対局一覧</title>
  <style>
    body {
      margin: 0;
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "MS Mincho", serif;
      background: #ffffff;
    }

    .container {
      display: flex;
      height: 100vh;
      margin-left: 0;
    }

    /* Sidebar */
    .sidebar {
      width: 272px; /* 画像の Rectangle 5 に合わせる */
      background: #4D5D70; /* Figma 指定色 */
      color: #ffffff;
      padding: 20px 0;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }

    .logo {
      font-size: 48px;
      font-weight: 400;
      text-align: left;
      padding-left: 27px;
      letter-spacing: 1px;
      color: #FFE498;
      margin-bottom: 40px;
    }

    .menu li {
      padding: 18px 32px;
      font-size: 22px;
      list-style: none;
      border-bottom: none;
    }

    .menu li.active {
      background: #e5e5e5;
      color: #333;
      font-weight: 600;
    }

    .profile {
      margin-top: auto;
      padding: 28px 32px 20px;
      font-size: 18px;
      line-height: 1.85;
    }

    /* Main */
    .main {
      flex: 1;
      padding: 32px 40px 40px 40px; /* 左余白を少し戻す（画像寄せ） */
      box-sizing: border-box;
    }

    .title {
      font-size: 26px;
      margin-bottom: 20px;
    }

    .table-wrapper {
      border: 1px solid #000000;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    thead th {
      background: #D9D9D9;
      padding: 14px 8px;
      font-size: 18px;
      font-weight: 600;
      border-right: 1px solid rgba(0,0,0,0.6);
      border-bottom: 1px solid #000000;
    }

    tbody td {
      padding: 18px 10px;
      font-size: 18px;
      border-right: 1px solid rgba(0,0,0,0.6);
      border-top: 1px solid rgba(0,0,0,0.6);
      vertical-align: top;
    }

    thead th:last-child,
    tbody td:last-child {
      border-right: none;
    }

    .pagination {
      background: #D9D9D9;
      text-align: center;
      padding: 10px 0;
      font-size: 18px;
      color: #ffffff;
      letter-spacing: 10px;
      border-top: 1px solid #000000;
    }

    .observe {
      margin-top: 40px;
      text-align: right;
    }

    .observe button {
      font-size: 22px;
      padding: 10px 30px;
      border: 2px solid #5b6a7c;
      background: #ffffff;
      color: #5b6a7c;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .observe button:hover {
      background: #5b6a7c;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <div class="logo">KiNote</div>
      <ul class="menu">
        <li class="active">TOP</li>
        <li>My Page</li>
        <li>Database</li>
        <li>Contact us</li>
      </ul>
      <div class="profile">
        大西公貴 さん<br>
        高1 / 開成<br><br>
        （段位）3段<br>
        （レート）1800<br>
        （月戦績）32 - 24<br>
        （先月比）+29
      </div>
    </aside>

    <main class="main">
      <div class="title">★ 現在の対局一覧</div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th style="width:60px;"></th>
              <th>対局者1（学校／レート）</th>
              <th>対局者2（学校／レート）</th>
              <th style="width:120px;">Type</th>
              <th style="width:120px;">状態</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>1.</td>
              <td>開成次郎（開成／1800）</td>
              <td>開成太郎（開成／1700）</td>
              <td>Rated</td>
              <td>対局中<br>感想戦<br>―</td>
            </tr>
          </tbody>
        </table>
        <div class="pagination">◀ 1 2 3 … 10 ▶</div>
      </div>

      <div class="observe">
        <button>観戦する</button>
      </div>
    </main>
  </div>
</body>
</html>
